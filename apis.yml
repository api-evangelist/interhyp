aid: interhyp
name: Interhyp
description: >-
  Interhyp AG is Germany's leading platform for residential mortgage financing
  (Baufinanzierung), connecting homebuyers and partners with the best financing
  options by comparing offers from more than 500 loan partners. Through its
  Developer Studio (developer.ehyphome.de) Interhyp publishes a partner-facing
  REST API surface — most notably the Submission API — that lets brokers,
  referrers and platforms integrate mortgage submission workflows, financing
  applications, documents, logbooks and pre-submission checks directly into their
  own applications. The API is designed "API First" and "Mobile First", secured
  with OAuth 2.0 JWT bearer tokens plus an Api-Key header, uses cursor-based
  pagination, RFC 7807 problem+json error responses and traceId request tracing.
  Interhyp is part of the ING Group and operates the broker brand Prohyp.
